name: GCP environment plan and controlled deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, staging, prod]
      image_digest:
        description: Fully qualified Artifact Registry image @sha256 digest
        required: true
        type: string
      apply:
        description: Apply reviewed plan? Protected GitHub environment approvals are required.
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: gcp-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: gcp-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.0'
      - name: Initialize isolated GCS state
        env:
          TF_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: terraform -chdir=infra init -input=false -backend-config="bucket=$TF_BUCKET" -backend-config="prefix=${{ github.event.repository.name }}/${{ inputs.environment }}"
      - name: Validate terraform
        run: terraform -chdir=infra validate -no-color
      - name: Validate immutable image digest
        env:
          IMAGE: ${{ inputs.image_digest }}
        run: |
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo 'Digest must be immutable'; exit 1; }
      - name: Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_image: ${{ inputs.image_digest }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_oidc_issuer: ${{ vars.OIDC_ISSUER }}
          TF_VAR_oidc_audience: ${{ vars.OIDC_AUDIENCE }}
          TF_VAR_oidc_jwks_url: ${{ vars.OIDC_JWKS_URL }}
          TF_VAR_tenant_region_policy: ${{ vars.TENANT_REGION_POLICY_JSON }}
          TF_VAR_genai_model: ${{ vars.GENAI_MODEL }}
          TF_VAR_ops_allowed_services: ${{ vars.OPS_ALLOWED_SERVICES }}
        run: |
          terraform -chdir=infra plan -input=false -out=deployment.tfplan -var-file="../environments/gcp/${{ inputs.environment }}.tfvars"
      - name: Apply exact reviewed plan
        if: ${{ inputs.apply }}
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_image: ${{ inputs.image_digest }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_oidc_issuer: ${{ vars.OIDC_ISSUER }}
          TF_VAR_oidc_audience: ${{ vars.OIDC_AUDIENCE }}
          TF_VAR_oidc_jwks_url: ${{ vars.OIDC_JWKS_URL }}
          TF_VAR_tenant_region_policy: ${{ vars.TENANT_REGION_POLICY_JSON }}
          TF_VAR_genai_model: ${{ vars.GENAI_MODEL }}
          TF_VAR_ops_allowed_services: ${{ vars.OPS_ALLOWED_SERVICES }}
        run: terraform -chdir=infra apply -input=false deployment.tfplan
