name: EKS Kubernetes environment plan and apply
on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, staging, prod]
      apply:
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: eks-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  cluster:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/feature/aws' }}
    environment: aws-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_KUBERNETES_DEPLOY_ROLE_ARN }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.0'
      - name: Init isolated S3 Kubernetes state
        env:
          STATE_BUCKET: ${{ vars.AWS_K8S_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          : "${STATE_BUCKET:?AWS_K8S_STATE_BUCKET missing}"
          : "${REGION:?AWS_REGION missing}"
          terraform -chdir=infra/kubernetes init -input=false             -backend-config="bucket=$STATE_BUCKET"             -backend-config="key=lsk/${{ github.event.repository.name }}/eks/${{ inputs.environment }}.tfstate"             -backend-config="region=$REGION"             -backend-config="use_lockfile=true"
      - name: Validate
        run: terraform -chdir=infra/kubernetes validate -no-color
      - name: Plan private EKS
        env:
          TF_VAR_service_name: ${{ vars.LSK_SERVICE_NAME }}
          TF_VAR_cluster_admin_role_arn: ${{ vars.EKS_CLUSTER_ADMIN_ROLE_ARN }}
          SELECTED_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          : "${TF_VAR_service_name:?LSK_SERVICE_NAME missing}"
          : "${TF_VAR_cluster_admin_role_arn:?EKS_CLUSTER_ADMIN_ROLE_ARN missing}"
          terraform -chdir=infra/kubernetes plan -input=false             -var-file="../../environments/kubernetes/${{ inputs.environment }}.tfvars"             -var="region=$SELECTED_REGION"             -out=release.tfplan
      - name: Apply reviewed private EKS plan
        if: ${{ inputs.apply }}
        run: terraform -chdir=infra/kubernetes apply -input=false release.tfplan
