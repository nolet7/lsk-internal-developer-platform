name: Azure container build and provenance
on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, staging, prod]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/feature/azure' }}
    runs-on: ubuntu-latest
    environment: azure-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to precreated environment ACR
        env:
          REGISTRY: ${{ vars.AZURE_ACR_NAME }}
        run: az acr login --name "$REGISTRY"
      - name: Resolve image tag
        id: coords
        env:
          SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          REPO: ${{ vars.AZURE_ACR_REPOSITORY }}
        run: |
          set -euo pipefail
          echo "image=$SERVER/$REPO:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.coords.outputs.image }}
          provenance: true
          sbom: true
      - name: Output immutable image digest
        env:
          TAGGED: ${{ steps.coords.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Verified published image: ${TAGGED%:*}@$DIGEST"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
